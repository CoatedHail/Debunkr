<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="A_paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE0"/>
      <stop offset="100%" stop-color="#E8DFCB"/>
    </linearGradient>
    <linearGradient id="A_hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4D648" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F5D93A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0CD30" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="A_noise"><feTurbulence baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.55 0 0 0 0 0.48 0 0 0 0 0.35 0 0 0 0.15 0"/><feComposite operator="in" in2="SourceGraphic"/></filter>
    <filter id="A_ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence baseFrequency="0.06" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#A_paper)"/>
  <rect width="1024" height="1024" filter="url(#A_noise)" opacity="0.55"/>
  <g transform="rotate(-2 512 550)">
    <rect x="112" y="450" width="800" height="200" rx="20" fill="url(#A_hl)" filter="url(#A_ink)"/>
  </g>
  <text x="512" y="618" text-anchor="middle" font-family="Georgia, serif" font-size="340" font-weight="700" fill="#1F1810" letter-spacing="-4">sift</text>
</svg>
